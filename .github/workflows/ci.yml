name: CI

# Windows is the Cavalry host; Ubuntu runs the same pure-Node suite so path, process and
# FFmpeg assumptions cannot regress silently. Cavalry itself is only exercised by the
# manual self-hosted job below. package.json allows win32 and linux, so npm ci works on
# both legs. macOS remains unsupported and is refused at install time.
#
# refclone is checked out into its own directory so the optional cavalry-mcp sibling can
# sit next to it. That layout is exactly what test/contract.test.mjs probes (via
# CAVALRY_MCP_ROOT, then ../cavalry-mcp), so the cross-repo contract runs automatically
# when the sibling checkout succeeds and skips cleanly in isolated forks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and synthetic-pipeline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: refclone
    steps:
      - name: Checkout refclone
        uses: actions/checkout@v4
        with:
          path: refclone

      # cavalry-mcp is public, so the default token can read it. The step is allowed to
      # fail: an isolated fork without access still runs the whole local suite, and the
      # contract test reports a skip instead of a fake pass.
      - name: Checkout sibling cavalry-mcp (optional cross-repo contract)
        id: cavalry
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/cavalry-mcp
          ref: main
          path: cavalry-mcp
          persist-credentials: false

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships Chocolatey but not FFmpeg, and the media stages need both
          # ffmpeg and ffprobe on PATH. Fail here rather than inside twenty later tests.
          choco install ffmpeg --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
          (Get-Command ffmpeg, ffprobe).Source
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: refclone/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build the cavalry-mcp sibling (cross-repo contract)
        if: steps.cavalry.outcome == 'success'
        working-directory: cavalry-mcp
        run: |
          npm ci
          npm run build

      - name: npm test
        # An empty value is filtered out by the contract locator, which then tries the
        # sibling path and skips honestly if the checkout did not happen.
        env:
          CAVALRY_MCP_ROOT: ${{ steps.cavalry.outcome == 'success' && format('{0}/cavalry-mcp', github.workspace) || '' }}
        run: npm test

      - name: verify (syntax, config, skills, privacy)
        run: npm run verify

      - name: verify:docs (every quoted test count is current)
        run: npm run verify:docs

  live-integration:
    name: Cavalry integration (manual, needs a real app)
    # Runs only on dispatch, and only against a self-hosted runner that is a Windows machine
    # with Cavalry 2.8 open and Scripts -> Stallion enabled. GitHub-hosted runners have no
    # Cavalry, so this job can never be made green by a push; it is evidence, not a gate.
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: npm ci
        run: npm ci
      - name: Integration run (requires Cavalry with Scripts > Stallion enabled)
        run: npm run test:integration
