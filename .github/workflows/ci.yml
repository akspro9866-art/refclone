name: CI

# Windows is the supported platform, so Windows is the only leg this verifies. The engine is
# plain Node ESM and has passed on Linux in the past, but nothing here claims or tests that any
# more: an unverified second platform is a promise the repository cannot keep. package.json
# carries the same decision as "os": ["win32"], so npm refuses the install elsewhere.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and synthetic-pipeline tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        shell: pwsh
        run: |
          # windows-latest ships Chocolatey but not FFmpeg, and the media stages need both
          # ffmpeg and ffprobe on PATH. Fail here rather than inside twenty later tests.
          choco install ffmpeg --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
          (Get-Command ffmpeg, ffprobe).Source
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Check out the sibling stack (stallion bridge + cavalry-mcp)
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/stallion
          path: stack/stallion

      - name: Check out cavalry-mcp
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/cavalry-mcp
          path: stack/cavalry-mcp

      - name: Build stallion
        working-directory: stack/stallion
        shell: pwsh
        run: |
          # NODE_ENV=production is set only for the build: npm ci would omit
          # devDependencies (esbuild) under it, and the production flag is
          # what turns the esbuild watch mode into a one-shot build.
          npm ci
          $env:NODE_ENV = 'production'
          npm run build

      - name: Build cavalry-mcp
        working-directory: stack/cavalry-mcp
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Syntax check every module
        run: node .github/scripts/syntax-check.mjs

      - name: Shipped configs stay in sync
        run: node .github/scripts/config-parity.mjs

      - name: Skill mirrors stay in sync
        run: node .github/scripts/skill-parity.mjs

      - name: No personal paths or private reference material
        run: node .github/scripts/privacy-scan.mjs

      - name: npm test
        run: npm test
        env:
          # With the sibling stack built, test/mock-bridge.e2e.test.mjs runs as
          # a hard gate; without it the e2e skips deterministically.
          STALLION_PATH: ${{ github.workspace }}/stack/stallion
          CAVALRY_MCP_PATH: ${{ github.workspace }}/stack/cavalry-mcp

      - name: Every test count in the docs is current
        run: node .github/scripts/test-count.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: |
            *.log
            test-output/
            jobs/
          retention-days: 7
          if-no-files-found: ignore

  live-integration:
    name: Cavalry integration (manual, needs a real app)
    # Runs on dispatch, on a push whose message asks for it, and never on an ordinary push or a
    # pull request. A self-hosted runner is a Windows machine with Cavalry 2.8 open and Scripts ->
    # Stallion enabled; GitHub-hosted runners have no Cavalry, so this job can never be made green
    # by a push — it is evidence, not a gate. The `push` guard is explicit because
    # github.event.head_commit is absent on pull_request events and contains() over null fails the
    # whole expression rather than returning false.
    # Opt in per commit: `git commit -m "qa: exercise live bridge [live-cavalry]"`.
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-cavalry]'))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: npm ci
        run: npm ci
      - name: Integration run (requires Cavalry with Scripts > Stallion enabled)
        run: npm run test:integration
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            *.log
            integration-output/
          retention-days: 30
          if-no-files-found: ignore
