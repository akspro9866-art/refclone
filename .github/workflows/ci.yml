name: CI

# The engine is plain Node ESM with no native dependencies, so the suite runs
# on Windows (the supported, evidence-gated platform) AND Ubuntu (the headless
# CI leg). Cavalry 2.8.0 itself never runs in either job: every synthetic
# pipeline test speaks to the MockStallionServer fixture (tests/fixtures/) or
# the sibling stallion --mock bridge, so 100% of the suite runs without
# skipping on both operating systems. Live-Cavalry evidence remains the
# separate self-hosted job below.
#
# cavalry-mcp arrives as a pinned git dependency through npm ci — no sibling
# checkout is needed for it. The stallion sibling is still checked out and
# built so test/e2e/mock-bridge.e2e.test.mjs stays a hard gate; it lives in
# .ci-siblings/ (gitignored and skipped by privacy-scan) so refclone itself
# keeps a normal root checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and synthetic-pipeline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships Chocolatey but not FFmpeg, and the media stages need both
          # ffmpeg and ffprobe on PATH. Fail here rather than inside twenty later tests.
          choco install ffmpeg --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
          (Get-Command ffmpeg, ffprobe).Source
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install FFmpeg (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        run: npm ci

      # The e2e mock-bridge gate needs a built stallion mock. It is checked out
      # into .ci-siblings/ (gitignored, skipped by privacy-scan) so the repo
      # root stays a plain refclone checkout.
      - name: Check out the stallion bridge (e2e gate)
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/stallion
          path: .ci-siblings/stallion

      - name: Build stallion
        working-directory: .ci-siblings/stallion
        shell: bash
        run: |
          # NODE_ENV=production is set only for the build: npm ci would omit
          # devDependencies (esbuild) under it, and the production flag is
          # what turns the esbuild watch mode into a one-shot build.
          npm ci
          NODE_ENV=production npm run build

      - name: Build (honest syntax gate, Node 24 native TS strip)
        run: npm run build

      - name: Shipped configs stay in sync
        run: node .github/scripts/config-parity.mjs

      - name: Skill mirrors stay in sync
        run: node .github/scripts/skill-parity.mjs

      - name: No personal paths or private reference material
        run: node .github/scripts/privacy-scan.mjs

      - name: Full test suite (strict + legacy)
        run: npm run test:ci
        env:
          # With the stallion mock built, test/e2e/mock-bridge.e2e.test.mjs runs
          # as a hard gate; without it the e2e skips deterministically.
          # cavalry-mcp resolves to the pinned git dependency in node_modules.
          STALLION_PATH: ${{ github.workspace }}/.ci-siblings/stallion
          CAVALRY_MCP_PATH: ${{ github.workspace }}/node_modules/cavalry-mcp

      - name: Every test count in the docs is current
        run: node .github/scripts/test-count.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            *.log
            test-output/
            jobs/
          retention-days: 7
          if-no-files-found: ignore

  live-integration:
    name: Cavalry integration (manual, needs a real app)
    # Runs on dispatch, on a push whose message asks for it, and never on an ordinary push or a
    # pull request. A self-hosted runner is a Windows machine with Cavalry 2.8 open and Scripts ->
    # Stallion enabled; GitHub-hosted runners have no Cavalry, so this job can never be made green
    # by a push — it is evidence, not a gate. The `push` guard is explicit because
    # github.event.head_commit is absent on pull_request events and contains() over null fails the
    # whole expression rather than returning false.
    # Opt in per commit: `git commit -m "qa: exercise live bridge [live-cavalry]"`.
    runs-on: self-hosted
    if: env.CAVALRY_LIVE == '1' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-cavalry]'))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: npm ci
        run: npm ci
      - name: Integration run (requires Cavalry with Scripts > Stallion enabled)
        run: npm run test:live
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            *.log
            integration-output/
          retention-days: 30
          if-no-files-found: ignore
