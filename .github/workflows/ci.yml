name: CI

# The engine is plain Node ESM with no native dependencies, so the suite runs
# on Windows (the supported, evidence-gated platform) AND Ubuntu (the headless
# CI leg). Cavalry 2.8.0 itself never runs in either job: every synthetic
# pipeline test speaks to the MockStallionServer fixture (tests/fixtures/) or
# the sibling stallion --mock bridge, so 100% of the suite runs without
# skipping on both operating systems. Live-Cavalry evidence remains the
# separate self-hosted job below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and synthetic-pipeline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # The repo is checked out into refclone/ (not the workspace root) so
        # that file:../cavalry-mcp resolves exactly like a local checkout.
        working-directory: refclone
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: refclone

      - name: Install FFmpeg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships Chocolatey but not FFmpeg, and the media stages need both
          # ffmpeg and ffprobe on PATH. Fail here rather than inside twenty later tests.
          choco install ffmpeg --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
          (Get-Command ffmpeg, ffprobe).Source
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install FFmpeg (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: refclone/package-lock.json

      # The package manifest depends on cavalry-mcp via file:../cavalry-mcp, so
      # the sibling stack is checked out next to refclone/ at the workspace
      # root — the same layout a local developer has — before npm ci runs.
      - name: Check out the sibling stallion bridge
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/stallion
          path: stallion

      - name: Check out the sibling cavalry-mcp
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/cavalry-mcp
          path: cavalry-mcp

      - name: npm ci
        run: npm ci

      - name: Build stallion
        working-directory: ${{ github.workspace }}/stallion
        shell: bash
        run: |
          # NODE_ENV=production is set only for the build: npm ci would omit
          # devDependencies (esbuild) under it, and the production flag is
          # what turns the esbuild watch mode into a one-shot build.
          npm ci
          NODE_ENV=production npm run build

      - name: Build cavalry-mcp
        working-directory: ${{ github.workspace }}/cavalry-mcp
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Build (honest syntax gate, Node 24 native TS strip)
        run: npm run build

      - name: Shipped configs stay in sync
        run: node .github/scripts/config-parity.mjs

      - name: Skill mirrors stay in sync
        run: node .github/scripts/skill-parity.mjs

      - name: No personal paths or private reference material
        run: node .github/scripts/privacy-scan.mjs

      - name: Full test suite (strict + legacy)
        run: npm run test:ci
        env:
          # With the sibling stack built, test/e2e/mock-bridge.e2e.test.mjs runs as
          # a hard gate; without it the e2e skips deterministically.
          STALLION_PATH: ${{ github.workspace }}/stallion
          CAVALRY_MCP_PATH: ${{ github.workspace }}/cavalry-mcp

      - name: Every test count in the docs is current
        run: node .github/scripts/test-count.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            refclone/*.log
            refclone/test-output/
            refclone/jobs/
          retention-days: 7
          if-no-files-found: ignore

  live-integration:
    name: Cavalry integration (manual, needs a real app)
    # Runs on dispatch, on a push whose message asks for it, and never on an ordinary push or a
    # pull request. A self-hosted runner is a Windows machine with Cavalry 2.8 open and Scripts ->
    # Stallion enabled; GitHub-hosted runners have no Cavalry, so this job can never be made green
    # by a push — it is evidence, not a gate. The `push` guard is explicit because
    # github.event.head_commit is absent on pull_request events and contains() over null fails the
    # whole expression rather than returning false.
    # Opt in per commit: `git commit -m "qa: exercise live bridge [live-cavalry]"`.
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-cavalry]'))
    timeout-minutes: 30
    defaults:
      run:
        working-directory: refclone
    steps:
      - uses: actions/checkout@v4
        with:
          path: refclone
      - name: Check out the sibling cavalry-mcp
        uses: actions/checkout@v4
        with:
          repository: akspro9866-art/cavalry-mcp
          path: cavalry-mcp
      - name: npm ci
        run: npm ci
      - name: Build cavalry-mcp
        working-directory: ${{ github.workspace }}/cavalry-mcp
        shell: bash
        run: |
          npm ci
          npm run build
      - name: Integration run (requires Cavalry with Scripts > Stallion enabled)
        run: npm run test:live
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            refclone/*.log
            refclone/integration-output/
          retention-days: 30
          if-no-files-found: ignore
